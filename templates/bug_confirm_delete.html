{% extends "base.html" %}
{% block title %}Delete Bug | BugTrack{% endblock %}
{% block content %}
<div class="card shadow-sm form-card"><div class="card-body p-4">
<h3>Delete "{{ bug.title }}"?</h3><p class="text-muted">This action cannot be undone.</p>
<form method="post">{% csrf_token %}<a href="{% url 'bug_detail' bug.pk %}" class="btn btn-outline-secondary">Cancel</a> <button class="btn btn-danger">Delete</button></form>
</div></div>
{% endblock %}
