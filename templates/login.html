{% extends "base.html" %}
{% block title %}Login | BugTrack{% endblock %}
{% block content %}
<div class="auth-card card shadow-sm mx-auto">
  <div class="card-body p-4">
    <h2 class="mb-1">Welcome back</h2>
    <p class="text-muted">Login to manage software bugs.</p>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      {% if form.errors %}<div class="alert alert-danger">Invalid username or password.</div>{% endif %}
      <button class="btn btn-dark w-100">Login</button>
    </form>
    <p class="text-center mt-3 mb-0">New user? <a href="{% url 'register' %}">Create account</a></p>
  </div>
</div>
{% endblock %}
