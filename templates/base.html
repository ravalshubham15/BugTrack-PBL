<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}BugTrack{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand fw-bold" href="{% url 'dashboard' %}">🐛 BugTrack</a>
    <div class="d-flex align-items-center gap-2">
      {% if user.is_authenticated %}
        <a class="btn btn-outline-light btn-sm" href="{% url 'bug_list' %}">All Bugs</a>
        <a class="btn btn-primary btn-sm" href="{% url 'bug_create' %}">+ Report Bug</a>
        <span class="text-white small ms-2">Hi, {{ user.username }}</span>
        <form method="post" action="{% url 'logout' %}" class="d-inline">
          {% csrf_token %}
          <button class="btn btn-outline-light btn-sm" type="submit">Logout</button>
        </form>
      {% endif %}
    </div>
  </div>
</nav>
<main class="container py-4">
  {% for message in messages %}
    <div class="alert alert-success">{{ message }}</div>
  {% endfor %}
  {% block content %}{% endblock %}
</main>
<footer class="text-center text-muted py-4">BugTrack</footer>
</body>
</html>
